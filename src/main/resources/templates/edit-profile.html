<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Civic Smart Tracking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Include Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card card-custom p-4 p-md-5 shadow">

                    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                        <h4 class="fw-bold text-primary mb-0">
                            <i class="bi bi-person-gear me-2"></i> Edit Citizen Profile
                        </h4>
                        <a th:href="@{/citizen/dashboard}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                    </div>

                    <!-- Alert Messages -->
                    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/citizen/edit-profile}" method="post">
                        
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address (Read-Only)</label>
                            <input type="email" class="form-control bg-light" th:value="${user.email}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" th:value="${user.name}" required>
                        </div>

                        <div class="mb-3">
                            <label for="mobile" class="form-label fw-semibold">Mobile Number</label>
                            <input type="tel" class="form-control" id="mobile" name="mobile" th:value="${user.mobile}" pattern="[0-9]{10}" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">New Password (Leave blank to keep current)</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password">
                        </div>

                        <button type="submit" class="btn btn-gov-primary w-100 py-2.5 fw-bold fs-6">
                            <i class="bi bi-save-fill me-1"></i> Save Profile Changes
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
