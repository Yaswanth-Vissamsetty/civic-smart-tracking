<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Citizens Directory | Admin Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Include Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h3 class="fw-bold text-dark mb-1">
                    <i class="bi bi-people-fill text-success me-2"></i> Registered Citizens Directory
                </h3>
                <p class="text-muted small mb-0">List of all citizens registered on the Civic Smart Tracking Portal</p>
            </div>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Dashboard
            </a>
        </div>

        <!-- Users Table Card -->
        <div class="card card-custom p-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Mobile Number</th>
                            <th>Account Role</th>
                            <th>Registered On</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="fw-bold" th:text="${u.id}">1</td>
                            <td>
                                <div class="fw-bold text-primary" th:text="${u.name}">Rahul Sharma</div>
                            </td>
                            <td th:text="${u.email}">rahul@gmail.com</td>
                            <td th:text="${u.mobile}">9811223344</td>
                            <td>
                                <span class="badge bg-success" th:text="${u.role}">CITIZEN</span>
                            </td>
                            <td th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-01 10:00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="text-center py-5 text-muted">
                                <i class="bi bi-people fs-1 d-block mb-2"></i>
                                No citizens registered yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
