<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- Navigation Bar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-gov sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-building-fill-check"></i> CivicCare
            <span class="gov-badge ms-2">Smart Tracking</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#govNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="govNavbar">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/#services}">Services</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/#how-it-works}">How It Works</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/track}">Track Status</a>
                </li>

                <!-- Citizen Session Logged In -->
                <th:block th:if="${session.loggedInUser != null and session.userRole == 'CITIZEN'}">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold text-warning" th:href="@{/citizen/dashboard}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/citizen/register-complaint}">
                            <i class="bi bi-plus-circle"></i> Lodge Complaint
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/citizen/my-complaints}">My Complaints</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDrop" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle me-1"></i> <span th:text="${session.loggedInUser.name}">Citizen</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-content dropdown-item" th:href="@{/citizen/edit-profile}"><i class="bi bi-pencil-square me-2"></i> Edit Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                        </ul>
                    </li>
                </th:block>

                <!-- Admin Session Logged In -->
                <th:block th:if="${session.adminUser != null and session.userRole == 'ADMIN'}">
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-semibold" th:href="@{/admin/dashboard}">
                            <i class="bi bi-shield-lock-fill"></i> Admin Panel
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/complaints}">All Complaints</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" th:href="@{/admin/logout}">
                            <i class="bi bi-box-arrow-right"></i> Admin Logout
                        </a>
                    </li>
                </th:block>

                <!-- Guest Links -->
                <th:block th:if="${session.loggedInUser == null and session.adminUser == null}">
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-outline-light btn-sm me-1 px-3" th:href="@{/login}">Citizen Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-warning btn-sm px-3 fw-bold text-dark" th:href="@{/register}">Register</a>
                    </li>
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-dark btn-sm px-3" th:href="@{/admin/login}" title="Municipal Admin Portal">
                            <i class="bi bi-shield-lock"></i> Admin
                        </a>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
