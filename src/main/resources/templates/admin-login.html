<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Civic Smart Tracking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <!-- Include Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5 my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-custom p-4 p-md-5 shadow-lg bg-white text-dark">

                    <div class="text-center mb-4">
                        <div class="bg-dark text-warning rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 65px; height: 65px;">
                            <i class="bi bi-shield-lock-fill fs-1"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Municipal Admin Portal</h3>
                        <p class="text-muted small">Administrative Access Only</p>
                    </div>

                    <!-- Alert Messages -->
                    <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i> <span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/admin/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Admin Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                <input type="email" class="form-control" id="email" name="email" value="admin@civic.gov.in" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Admin Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control" id="password" name="password" value="admin123" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2.5 fw-bold fs-6 mb-3 text-warning border-warning">
                            <i class="bi bi-shield-check me-1"></i> Authenticate Admin
                        </button>

                        <div class="text-center border-top pt-3">
                            <a th:href="@{/}" class="small text-muted text-decoration-none">
                                <i class="bi bi-arrow-left"></i> Return to Main Portal
                            </a>
                        </div>
                    </form>

                </div>

                <!-- Admin Credentials Info -->
                <div class="card bg-secondary text-white mt-3 p-3 text-center border-0 small">
                    <div><i class="bi bi-info-circle text-warning me-1"></i> <strong>Default Admin Credentials:</strong></div>
                    <div>Email: <code>admin@civic.gov.in</code> | Password: <code>admin123</code></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Include Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
