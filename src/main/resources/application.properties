# Application Name & Server Port
spring.application.name=civic-smart-tracking
server.port=${PORT:8080}

# =========================================================
# EMBEDDED H2 DATABASE CONFIGURATION (DEFAULT / ZERO SETUP)
# =========================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:civicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration for H2
spring.jpa.database-platform=${DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data Initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Thymeleaf Cache Settings (Disabled for Dev)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.civic.smarttracking=DEBUG

