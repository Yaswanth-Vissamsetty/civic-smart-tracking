services:
  - type: web
    name: civic-smart-tracking
    runtime: docker
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civic-smart-tracking-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: production

databases:
  - name: civic-smart-tracking-db
    databaseName: civic_tracking
    user: civic_tracking_user
    region: singapore
    plan: free
