services:
  - type: web
    name: civic-smart-tracking
    runtime: java
    region: singapore
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: DATABASE_URL="jdbc:${DATABASE_URL}" DATABASE_DRIVER=org.postgresql.Driver DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect java -jar target/smart-tracking-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civic-smart-tracking-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: production

databases:
  - name: civic-smart-tracking-db
    databaseName: civic_tracking
    user: civic_tracking_user
    region: singapore
    plan: free
